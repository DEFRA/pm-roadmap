{% extends "roadmap/base.html" %}
{% block title %}Onboarding — PM-Roadmap{% endblock %}

{% block extra_head %}
<style>
  .doc { max-width: 820px; margin: 1rem auto 4rem; padding: 0 4px; line-height: 1.65; color: #1f2a24; }
  .doc h1 { font-size: 30px; margin: 0 0 .5rem; letter-spacing: -.02em; }
  .doc h2 { font-size: 21px; margin: 2.2rem 0 .6rem; padding-top: 1.2rem; border-top: 1px solid #e2e7dd; letter-spacing: -.01em; }
  .doc h3 { font-size: 16px; margin: 1.4rem 0 .4rem; }
  .doc p { margin: 0 0 .9rem; }
  .doc ul, .doc ol { margin: 0 0 1rem; padding-left: 1.3rem; }
  .doc li { margin: .3rem 0; }
  .doc a { color: #0c5544; text-underline-offset: 2px; }
  .doc strong { color: #16221c; }
  .doc code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .86em;
    background: #eef2ea; border: 1px solid #dde3d6; border-radius: 5px; padding: 1px 5px; }
  .doc pre { background: #eef2ea; border: 1px solid #dde3d6; border-radius: 10px; padding: 14px 15px;
    overflow-x: auto; line-height: 1.6; margin: 0 0 1rem; }
  .doc pre code { background: none; border: 0; padding: 0; font-size: 12.5px; }
  .doc blockquote { margin: 0 0 1rem; padding: 10px 15px; border: 1px solid #e7dcc0;
    border-left: 3px solid #b8860b; border-radius: 10px; background: #f8f1dd; color: #5b4a1e; }
  .doc blockquote p { margin: 0; }
  .doc blockquote strong { color: #7a5c00; }
  .doc table { border-collapse: collapse; width: 100%; margin: 0 0 1rem; font-size: 14px; display: block; overflow-x: auto; }
  .doc th, .doc td { border: 1px solid #dde3d6; padding: 7px 10px; text-align: left; vertical-align: top; }
  .doc th { background: #eef2ea; font-weight: 600; }
  .doc hr { border: 0; border-top: 1px solid #e2e7dd; margin: 2rem 0; }
  .doc em { color: #40504a; }
  .doc-meta { max-width: 820px; margin: 1.2rem auto 0; padding: 0 4px; font-size: 12.5px; color: #6a776c; }
  .doc-meta a { color: #0c5544; }
</style>
{% endblock %}

{% block content %}
<div class="doc-meta">Rendered live from <code>docs/onboarding.md</code> in the repository — the single source of truth.</div>
<article class="doc">{{ content|safe }}</article>
{% endblock %}
